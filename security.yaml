security:
  # ...
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\UserAuthenticator # Correct!


      form_login:
        # "app_login" is the name of the route created previously
        login_path: app_login
        check_path: app_login
      logout:
        path: app_logout
        # where to redirect after logout
        target: app_home
  access_control:
    - { path: ^/admin/profile, roles: ROLE_EDITOR }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/, roles: ROLE_USER } # Règle générale pour les autres routes